<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2448c8">
<meta name="description" content="Practice quiz: 80 Oracle AI Database Foundations Associate questions with answers and explanations.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>Oracle AI Database Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: single study column, one question per screen, sticky action bar at the thumb */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --fg: #16202c;
  --muted: #5b6878;
  --line: #d5dce5;
  --accent: #2448c8;
  --accent-soft: #e3e9fb;
  --ok: #17794f;
  --ok-soft: #e1f3ea;
  --bad: #b8392a;
  --bad-soft: #fbe6e2;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #18202a; --fg: #e6ebf2; --muted: #98a4b4; --line: #2b3644;
    --accent: #8ea8ff; --accent-soft: #1f2a4a; --ok: #5fd39c; --ok-soft: #133226; --bad: #ff8a78; --bad-soft: #3a1c18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #18202a; --fg: #e6ebf2; --muted: #98a4b4; --line: #2b3644;
  --accent: #8ea8ff; --accent-soft: #1f2a4a; --ok: #5fd39c; --ok-soft: #133226; --bad: #ff8a78; --bad-soft: #3a1c18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 120px; display: flex; flex-direction: column; gap: 14px; }

header { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.score { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.score b { color: var(--fg); }

.sets { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.sets::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 700 0.85rem var(--body); padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { font-family: var(--mono); font-weight: 500; opacity: .7; margin-left: 4px; }

.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .c { background: var(--ok); } .bar .w { background: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.meta .pill { padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.qtext { font-size: 1.08rem; font-weight: 700; margin: 0; text-wrap: pretty; }

.opts { display: flex; flex-direction: column; gap: 9px; margin: 0; padding: 0; list-style: none; }
.opt { width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; font: inherit; font-size: 0.98rem; color: var(--fg); background: var(--bg); border: 2px solid transparent; border-radius: 11px; padding: 11px 12px; cursor: pointer; }
.opt .k { font-family: var(--mono); font-weight: 700; font-size: 0.85rem; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.opt span:last-child { min-width: 0; padding-top: 2px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: .6; }
.opt:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.verdict { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 14px; }
.verdict h2 { font-family: var(--display); font-weight: 600; font-size: 1.05rem; margin: 0; }
.verdict.ok h2 { color: var(--ok); } .verdict.no h2 { color: var(--bad); }
.verdict .ans { margin: 0; font-weight: 700; }
.verdict .exp { margin: 0; color: var(--fg); font-size: 0.96rem; }
.verdict .lbl { font-family: var(--mono); font-size: 0.72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tbtn { font: 700 0.85rem var(--body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer; }
.tbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tools .sp { flex: 1; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.grid button { font: 700 0.82rem var(--mono); padding: 9px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
.grid button.c { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.grid button.w { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.grid button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.danger { color: var(--bad); border-color: var(--bad); }

.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty strong { display: block; font-family: var(--display); font-size: 1.2rem; color: var(--fg); margin-bottom: 6px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }
.nav { font: 700 1.2rem var(--body); border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.nav:disabled { opacity: .35; cursor: default; }
.main { font: 700 1rem var(--body); border-radius: 12px; border: 0; padding: 14px; background: var(--accent); color: var(--surface); cursor: pointer; }
.main:disabled { background: var(--line); color: var(--muted); cursor: default; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Oracle AI Database Drill</h1>
      <div class="score" id="score"></div>
    </div>
    <div class="sets" id="sets" role="group" aria-label="Question set"></div>
    <div class="bar" id="bar" aria-hidden="true"><i class="c"></i><i class="w"></i></div>
  </header>

  <main id="stage"></main>

  <div class="tools">
    <button class="tbtn" id="tShuffleQ" aria-pressed="false">Shuffle questions</button>
    <button class="tbtn" id="tShuffleO" aria-pressed="false">Shuffle options</button>
    <span class="sp"></span>
    <button class="tbtn" id="tGrid" aria-expanded="false">All questions</button>
  </div>

  <section class="panel" id="gridPanel" hidden>
    <p>Green = answered correctly, red = wrong. Tap a number to jump to it.</p>
    <div class="grid" id="grid"></div>
    <div class="confirm" id="resetRow">
      <button class="tbtn danger" id="reset">Reset all progress</button>
    </div>
  </section>
</div>

<nav class="dock">
  <div class="in">
    <button class="nav" id="prev" aria-label="Previous question">&#8592;</button>
    <button class="main" id="action">Check answer</button>
    <button class="nav" id="next" aria-label="Next question">&#8594;</button>
  </div>
</nav>

<script src="questions.js"></script>
<script>
const DATA = window.QUESTIONS;
const KEY = "oadb-drill-v1";
const LETTERS = ["A","B","C","D"];

let store = { ans: {}, set: "all", shuffleQ: false, shuffleO: false, pos: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) store = Object.assign(store, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

let order = [];      // list of question ids for current set
let idx = 0;
let optOrder = {};   // id -> permutation, stable within the session
let pending = null;  // selected original-option index before checking

const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
const isCorrect = id => store.ans[id] && store.ans[id] === byId[id].c + 1;
const isWrong = id => store.ans[id] && store.ans[id] !== byId[id].c + 1;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const SETS = [
  { k: "all", label: "All 80", f: () => true },
  { k: "p1", label: "Part 1", f: q => q.part === 1 },
  { k: "p2", label: "Part 2", f: q => q.part === 2 },
  { k: "todo", label: "Unanswered", f: q => !store.ans[q.id] },
  { k: "missed", label: "Missed", f: q => isWrong(q.id) },
];

function buildOrder(keepCurrent) {
  const set = SETS.find(s => s.k === store.set) || SETS[0];
  const cur = order[idx];
  let ids = DATA.filter(set.f).map(q => q.id);
  if (store.shuffleQ) ids = shuffle(ids);
  order = ids;
  const remembered = store.pos[store.set];
  if (keepCurrent && cur && order.includes(cur)) idx = order.indexOf(cur);
  else if (!store.shuffleQ && remembered && order.includes(remembered)) idx = order.indexOf(remembered);
  else idx = 0;
}

function renderSets() {
  const el = document.getElementById("sets");
  el.innerHTML = "";
  SETS.forEach(s => {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", store.set === s.k);
    const n = DATA.filter(s.f).length;
    b.innerHTML = `${s.label}<span class="n">${n}</span>`;
    b.onclick = () => { store.set = s.k; pending = null; buildOrder(false); save(); render(); };
    el.appendChild(b);
  });
}

function renderScore() {
  const done = Object.keys(store.ans).length;
  const right = DATA.filter(q => isCorrect(q.id)).length;
  const pct = done ? Math.round(right / done * 100) : 0;
  document.getElementById("score").innerHTML = `<b>${right}</b>/${done} correct · ${pct}% · ${80 - done} left`;
  const [c, w] = document.querySelectorAll("#bar i");
  c.style.width = (right / 80 * 100) + "%";
  w.style.width = ((done - right) / 80 * 100) + "%";
}

function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

function render() {
  renderSets(); renderScore(); renderGrid();
  const stage = document.getElementById("stage");
  const prev = document.getElementById("prev"), next = document.getElementById("next"), action = document.getElementById("action");
  if (!order.length) {
    const msg = store.set === "missed" ? ["No missed questions", "Questions you get wrong will collect here for review."]
              : ["All done here", "Every question in this set has been answered. Pick another set or reset progress."];
    stage.innerHTML = `<div class="card empty"><strong>${msg[0]}</strong>${msg[1]}</div>`;
    prev.disabled = next.disabled = true; action.disabled = true; action.textContent = "Check answer";
    return;
  }
  const id = order[idx], q = byId[id];
  store.pos[store.set] = id; save();
  if (!optOrder[id]) optOrder[id] = store.shuffleO ? shuffle([0,1,2,3]) : [0,1,2,3];
  const perm = optOrder[id];
  const answered = store.ans[id];      // stored as original index + 1
  const chosen = answered ? answered - 1 : pending;

  let html = `<article class="card" aria-live="polite">
    <div class="meta"><span class="pill">Part ${q.part} · Q${q.n}</span><span>${idx + 1} / ${order.length}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <ul class="opts">`;
  perm.forEach((oi, pos) => {
    let cls = "";
    if (answered) { if (oi === q.c) cls = "right"; else if (oi === chosen) cls = "wrong"; }
    else if (oi === chosen) cls = "sel";
    html += `<li><button class="opt ${cls}" data-oi="${oi}" ${answered ? "disabled" : ""}><span class="k">${LETTERS[pos]}</span><span>${esc(q.o[oi])}</span></button></li>`;
  });
  html += `</ul>`;
  if (answered) {
    const ok = chosen === q.c;
    const letter = LETTERS[perm.indexOf(q.c)];
    html += `<div class="verdict ${ok ? "ok" : "no"}">
      <h2>${ok ? "Correct" : "Not quite"}</h2>
      <span class="lbl">Answer</span>
      <p class="ans">${letter}. ${esc(q.o[q.c])}</p>
      <span class="lbl">Explanation</span>
      <p class="exp">${esc(q.e)}</p>
    </div>`;
  }
  html += `</article>`;
  stage.innerHTML = html;
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => { pending = +b.dataset.oi; render(); });

  prev.disabled = idx === 0;
  next.disabled = idx === order.length - 1;
  if (answered) { action.disabled = false; action.textContent = idx === order.length - 1 ? "Back to first" : "Next question"; }
  else { action.disabled = pending === null; action.textContent = pending === null ? "Select an answer" : "Check answer"; }
}

function renderGrid() {
  const g = document.getElementById("grid");
  g.innerHTML = "";
  DATA.forEach(q => {
    const b = document.createElement("button");
    b.textContent = q.part + "·" + q.n;
    b.title = `Part ${q.part} question ${q.n}`;
    if (isCorrect(q.id)) b.className = "c"; else if (isWrong(q.id)) b.className = "w";
    if (order[idx] === q.id) b.classList.add("cur");
    b.onclick = () => {
      if (!order.includes(q.id)) { store.set = "all"; buildOrder(false); }
      idx = order.indexOf(q.id); pending = null; render(); window.scrollTo({ top: 0 });
    };
    g.appendChild(b);
  });
}

function go(d) { idx = Math.max(0, Math.min(order.length - 1, idx + d)); pending = null; render(); window.scrollTo({ top: 0 }); }
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("action").onclick = () => {
  const id = order[idx];
  if (!id) return;
  if (store.ans[id]) {
    if (store.set === "todo") { buildOrder(false); pending = null; render(); window.scrollTo({ top: 0 }); return; }
    if (idx === order.length - 1) { idx = 0; pending = null; render(); window.scrollTo({ top: 0 }); } else go(1);
    return;
  }
  if (pending === null) return;
  store.ans[id] = pending + 1; pending = null; save(); render();
};

function toggle(btnId, key) {
  const b = document.getElementById(btnId);
  b.setAttribute("aria-pressed", store[key]);
  b.onclick = () => {
    store[key] = !store[key]; b.setAttribute("aria-pressed", store[key]);
    if (key === "shuffleO") optOrder = {};
    buildOrder(key === "shuffleO"); pending = null; save(); render();
  };
}
toggle("tShuffleQ", "shuffleQ");
toggle("tShuffleO", "shuffleO");

document.getElementById("tGrid").onclick = e => {
  const p = document.getElementById("gridPanel");
  p.hidden = !p.hidden; e.currentTarget.setAttribute("aria-expanded", !p.hidden);
};

const resetRow = document.getElementById("resetRow");
function showReset() {
  resetRow.innerHTML = `<button class="tbtn danger" id="reset">Reset all progress</button>`;
  document.getElementById("reset").onclick = () => {
    resetRow.innerHTML = `<span style="color:var(--muted);font-size:.9rem">Clear all 80 answers?</span>
      <button class="tbtn danger" id="yes">Yes, reset</button><button class="tbtn" id="no">Cancel</button>`;
    document.getElementById("yes").onclick = () => { store.ans = {}; store.pos = {}; pending = null; save(); buildOrder(false); render(); showReset(); };
    document.getElementById("no").onclick = showReset;
  };
}
showReset();

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (["1","2","3","4","a","b","c","d"].includes(e.key.toLowerCase()) && order.length && !store.ans[order[idx]]) {
    const pos = "1234".includes(e.key) ? +e.key - 1 : "abcd".indexOf(e.key.toLowerCase());
    pending = optOrder[order[idx]][pos]; render();
  } else if (e.key === "Enter") document.getElementById("action").click();
});

buildOrder(false);
render();
</script>
</body>
</html>
